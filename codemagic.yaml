workflows:
  quizpilot-android-debug:
    name: QuizPilot Fast Android Debug
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Install Gradle 8.9
        script: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        script: |
          set -e
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
